<figure class="figure  figure--{{ include.position | default: 'center' }}" style="width: {{ include.width }}px; {% if include.position == 'center' %}**margin-left: auto; margin-right: auto;**{% elsif include.position == 'right' %}**margin-left: auto; margin-right: 0;**{% elsif include.position == 'left' %}**margin-left: 0; margin-right: auto;**{% endif %}">
  <img class="image" src="{{ include.image }}" alt="{{ include.alt | default: include.caption }}" {{ include.width ? include.width | prepend: 'width="' | append: '"' }} {{ include.height ? include.height | prepend: 'height="' | append: '"' }}>
  {% if include.caption %}<figcaption class="caption">{{ include.caption }}</figcaption>{% endif %}
</figure>
